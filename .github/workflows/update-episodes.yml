name: Update episodes from YouTube

on:
  schedule:
    # Runs once a day at 06:00 UTC. Adjust as you like.
    - cron: "0 6 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-episodes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest episodes
        run: node scripts/fetch-episodes.mjs

      - name: Commit changes if any
        run: |
          git config user.name "episode-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/episodes.json
          if git diff --cached --quiet; then
            echo "No new episodes — nothing to commit."
          else
            git commit -m "Update episodes from YouTube [automated]"
            git push
          fi
